# Install as /etc/nginx/sites-available/sinakratos.ir on Ubuntu/Debian.
# After DNS points to this server, run:
# sudo certbot --nginx --redirect -d sinakratos.ir -d www.sinakratos.ir
# Certbot adds HTTPS and the HTTP-to-HTTPS redirect to this installed file.
server {
    listen 80;
    server_name sinakratos.ir www.sinakratos.ir;

    access_log /var/log/nginx/sinakratos.access.log;
    error_log /var/log/nginx/sinakratos.error.log;

    # The application accepts photo files up to 5 MiB, plus multipart overhead.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        # Keep internal-host redirects (for example logout) on the public site.
        proxy_redirect http://127.0.0.1:3001/ /;
        proxy_redirect https://127.0.0.1:3001/ /;
        proxy_redirect http://localhost:3001/ /;
        proxy_redirect https://localhost:3001/ /;
    }
}
